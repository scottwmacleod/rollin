[package]
name = "rollin"
version = "2.0.1"
edition = "2021"

[lib]
name = "rollin"
path = "src/lib.rs"

[[bin]]
name = "rollin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.10"
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.12.0"
rexpect = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
