<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="rollin is a dice roller for tabletop RPGs. The web app is on its way." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>rollin</title>
    <script>
      // Set the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem("rollin-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
