[package]
name = "rollin-desktop"
version = "0.0.0" # placeholder: the release workflow injects the real version from the tag
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rollin = { path = "../../.." }
rollin-desktop-core = { path = "core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
