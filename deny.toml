# cargo-deny configuration; run by .github/workflows/audit.yml.
# Check locally with: cargo deny --workspace check

[graph]
# The desktop app is a workspace member but not a default member, so check the
# whole workspace or its (much larger) Tauri tree is skipped.
all-features = true

[advisories]
# Every entry is an "unmaintained" notice (no known vulnerability) on a
# transitive dependency of Tauri with no upgrade available. Revisit when Tauri
# or its plugins move off these crates, and drop the entries as they clear.
ignore = [
    # proc-macro-error: build-time proc-macro only, pulled in via Tauri's GTK stack.
    "RUSTSEC-2024-0370",
    # zvariant, zbus_names, zvariant_derive: via zbus, used by tauri-plugin-opener
    # (Linux only). Upstream zbus project moved; see z-galaxy/zbus#2043.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Derived from `cargo deny --workspace list`. A dual-licensed crate only needs
# one of its alternatives allowed (for example r-efi is MIT OR Apache-2.0 OR
# LGPL-2.1-or-later, so LGPL is deliberately not listed).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
