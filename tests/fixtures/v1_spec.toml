# The Python v1 test suite (git tag v1.0, tests/test_parser.py, test_roller.py,
# test_presets.py) as a data-driven parity spec, consumed by tests/v1_spec.rs.
#
# Every case is run as `rollin <formula> --seed 1 --json` and checked against the
# observable expectations below. status = "live" cases must pass;
# status = "ignored" cases are skipped and counted, and must give a reason naming
# the ticket that will un-ignore them. To un-ignore: fix the engine, then change
# status to "live" and delete the reason line.
#
# Fields: name, source (Python test), formula, status, reason, expect (ok|error),
# rolls, total_ranges, dice, kept, dropped, total_min, total_max, modifier
# (total == kept sum + modifier), dropped_extreme (lowest|highest).

[[case]]
name = "simple_d20"
source = "test_parser.py::test_simple_d20"
formula = "d20"
status = "live"
dice = 1
total_min = 1
