name: Bug report
description: Something in rollin does the wrong thing, crashes or gives a wrong result.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more exact the steps, the faster it gets fixed.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Safari
        - Chrome
        - Firefox
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser version and device
      placeholder: "Safari 19 on iPhone 16, Chrome 140 on Windows 11"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If a formula is involved, paste it exactly.
      placeholder: |
        1. Open the app
        2. Roll `4d6!dl1`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste any error text or add a screenshot.
    validations:
      required: true
