name: Feature request
description: Suggest something new, or a change to how something works.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Check the open issues first in case someone has asked already. For a half-formed idea or a question, start a discussion instead.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How you get by now, or other approaches you've thought about.
