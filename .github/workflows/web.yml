name: Web

# Gates for the TypeScript web app and engine. `web` is the only required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Lets docs-only PRs skip `web`. A job skipped by `if`
    # reports as skipped, which branch protection accepts. Fails open: pushes
    # to main, manual runs and any doubt about the diff run everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Skip when only docs or repo-config files changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/skip-if-only.sh '^(docs/|\.claude/|\.github/workflows/(audit|dependabot-automerge)\.yml$|skills-lock\.json$|LICENSE$|[^/]+\.md$)'

  web:
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: Typecheck
        run: npm run typecheck
      - name: Biome
        run: npx biome check .
      - name: Unit tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (with axe)
        run: npm run e2e
