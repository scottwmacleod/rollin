name: auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: scottwmacleod/sm-core/.github/workflows/auto-merge.yml@v26.11.34
    with:
      hold-label: hold
    secrets:
      merge-token: ${{ secrets.SM_MERGE_TOKEN }}
