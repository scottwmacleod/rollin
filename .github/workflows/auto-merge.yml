name: auto-merge

# Squash auto-merge for every PR from this repo's own branches, from sm-core's
# shared workflow. The implement loop's human stop is the `hold` label: a PR
# carrying it never gets auto-merge (docs/agents/implement.md). Dependabot
# PRs go through dependabot-automerge.yml instead. SM_MERGE_TOKEN turns
# auto-merge on with Scott's token, so the merge starts ci on main.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: scottwmacleod/sm-core/.github/workflows/auto-merge.yml@v26.11.12
    with:
      hold-label: hold
    secrets:
      merge-token: ${{ secrets.SM_MERGE_TOKEN }}
