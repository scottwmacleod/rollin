name: Release desktop app

# Builds a universal macOS bundle and attaches it to a GitHub Release. It is
# ad-hoc signed only, until the Apple signing secrets below exist; with all of
# them set it is Developer ID signed, notarized and stapled (see #112 and
# docs/desktop-install.md).
#
# Three ways in, none needing local git:
#   - schedule: daily. Releases a patch bump only if main has app changes since
#     the last release, and only if CI passed on that commit.
#   - workflow_dispatch: run it from the Actions tab or GitHub Mobile. Pick a
#     bump (patch/minor/major) or type an exact version.
#   - push of a desktop-vX.Y.Z tag: manual fallback; the version comes from the tag.
#
# The tag is the source of truth for the version. The plan job works it out and
# the build job writes it into tauri.conf.json in the runner's checkout only
# (nothing is committed); the Cargo.toml version is a placeholder. tauri-action
# creates the release, and GitHub creates the tag at the built commit.
# The tag prefix keeps app releases apart from CLI releases (see #61).
#
# The build also produces the updater bundle (Rollin.app.tar.gz), its .sig and
# latest.json, signed with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY
# and TAURI_SIGNING_PRIVATE_KEY_PASSWORD). The app reads latest.json from
# releases/latest/download, so the newest GitHub Release must be a desktop one;
# see docs/desktop-install.md.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest stable desktop release"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version (e.g. 0.3.0 or 0.3.0-rc.1); overrides the bump"
        type: string
        required: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    # Decides whether to release and which version. Cheap, so the expensive
    # macOS build only starts when there is something to ship.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # read CI results for the commit being released
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the last release
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          stop() { echo "release=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          last_tag=$(git tag --list 'desktop-v*' | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          last="${last_tag#desktop-v}"; last="${last:-0.0.0}"

          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#desktop-v}"
          else
            # Releases come from main only: a manual run on another branch is
            # an error, the schedule always runs on the default branch.
            if [ "$REF" != "refs/heads/main" ]; then
              echo "Releases are only built from main (ref is $REF)" >&2
              exit 1
            fi
            if [ -n "${EXACT:-}" ]; then
              version="$EXACT"
            else
              IFS=. read -r major minor patch <<< "$last"
              case "${BUMP:-patch}" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                patch) version="$major.$minor.$((patch + 1))" ;;
              esac
            fi
          fi

          if ! [[ "$version" =~ $semver ]]; then
            echo "'$version' is not a valid version" >&2
            exit 1
          fi
          tag="desktop-v$version"

          if [ "$EVENT" != "push" ]; then
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag already exists" >&2
              exit 1
            fi
            # A scheduled run is a no-op unless the app changed since the last release.
            if [ "$EVENT" = "schedule" ]; then
              if [ -n "$last_tag" ] && git diff --quiet "$last_tag" "$SHA" -- apps/desktop src Cargo.toml Cargo.lock; then
                stop "No app changes since $last_tag; nothing to release."
              fi
            fi
            # Only ship a commit whose required checks all passed. A release
            # started right after a merge can beat CI on main, so wait for
            # checks that are still queued or running (up to 15 minutes).
            deadline=$((SECONDS + 900))
            while :; do
              runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs')
              pending=""; failed=""
              for check in lint test test-linux desktop; do
                state=$(echo "$runs" | jq -r --arg n "$check" '[.[] | select(.name == $n)] | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
                case "$state" in
                  success) ;;
                  pending|missing) pending="$pending $check" ;;
                  *) failed="$failed $check ($state)" ;;
                esac
              done
              if [ -n "$failed" ]; then
                msg="Required checks failed on $SHA:$failed"
                if [ "$EVENT" = "schedule" ]; then stop "$msg; will retry tomorrow."; fi
                echo "$msg" >&2
                exit 1
              fi
              [ -z "$pending" ] && break
              if [ "$SECONDS" -ge "$deadline" ]; then
                msg="Required checks not finished on $SHA:$pending"
                if [ "$EVENT" = "schedule" ]; then stop "$msg; will retry tomorrow."; fi
                echo "$msg" >&2
                exit 1
              fi
              echo "Waiting for checks:$pending"
              sleep 20
            done
          fi

          # A hyphen in the version (0.2.0-rc.1) marks a pre-release.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "release=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous stable: ${last_tag:-none})"

  macos:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7
      - name: Set the app version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          grep '"version"' "$conf"
      - name: Check updater signing is set up
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop-install.md" >&2
            exit 1
          fi
          if grep -q REPLACE_WITH apps/desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json still has the placeholder updater public key" >&2
            exit 1
          fi
      # Apple Developer ID signing and notarization (#112). Inert until the
      # secrets exist: with none set the build stays ad-hoc signed as before;
      # with only some set it fails, so a half-configured release is never
      # shipped by accident. The values go to later steps via GITHUB_ENV so
      # that Tauri never sees empty APPLE_* variables.
      - name: Set up Apple signing and notarization
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY)
          set_count=0; missing=()
          for n in "${names[@]}"; do
            if [ -n "${!n:-}" ]; then set_count=$((set_count + 1)); else missing+=("$n"); fi
          done
          if [ "$set_count" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets set; building ad-hoc signed (unsigned for Gatekeeper)."
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Apple signing is partly configured; missing secrets: ${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Apple signing and notarization enabled."
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      # tauri-action v0.6.2. With bundle.createUpdaterArtifacts it also uploads
      # the signed .app.tar.gz, its .sig and latest.json (#114).
      - uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.plan.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Rollin desktop ${{ needs.plan.outputs.tag }}
          releaseBody: |
            ${{ steps.apple.outputs.signed == 'true' && 'macOS build (universal: Apple Silicon and Intel), signed with a Developer ID and notarized by Apple. See docs/desktop-install.md.' || 'Unsigned macOS build (universal: Apple Silicon and Intel). On first launch macOS will refuse to open it: right-click Rollin.app and choose Open, or run `xattr -dr com.apple.quarantine /Applications/Rollin.app`. See docs/desktop-install.md.' }}
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          args: --target universal-apple-darwin -- --locked
      - name: Check the release has the updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          for pattern in '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '^latest\.json$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "Missing asset matching $pattern" >&2; exit 1; }
          done
      - name: Verify Apple signing and notarization
        if: steps.apple.outputs.signed == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Rollin.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details=$(codesign -dvv "$app" 2>&1)
          echo "$details" | grep -q 'Authority=Developer ID Application'
          echo "$details" | grep -Eq 'flags=0x[0-9a-f]+\(.*runtime'
          spctl -a -vv -t exec "$app"
          xcrun stapler validate "$app"
          # The dmg is signed but Tauri does not staple it; report only.
          for dmg in "$bundle"/dmg/*.dmg; do
            codesign --verify --verbose=2 "$dmg"
            xcrun stapler validate "$dmg" || echo "dmg is not stapled (the app inside is)"
          done
