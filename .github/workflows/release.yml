name: Release desktop app

# Builds an unsigned universal macOS bundle and an unsigned Windows x64 (NSIS)
# installer and attaches both to one GitHub Release.
#
# Three ways in, none needing local git:
#   - schedule: daily. Releases a patch bump only if main has app changes since
#     the last release, and only if CI passed on that commit.
#   - workflow_dispatch: run it from the Actions tab or GitHub Mobile. Pick a
#     bump (patch/minor/major) or type an exact version.
#   - push of a desktop-vX.Y.Z tag: manual fallback; the version comes from the tag.
#
# The tag is the source of truth for the version. The plan job works it out and
# the build jobs write it into tauri.conf.json in the runner's checkout only
# (nothing is committed); the Cargo.toml version is a placeholder. GitHub
# creates the tag at the built commit when publish publishes the release.
# The tag prefix keeps app releases apart from CLI releases (see #61).
#
# Jobs: plan; release (creates a draft release and its notes); macos and
# windows in parallel (each only uploads its installer, updater bundle and
# .sig to the draft); publish (writes latest.json from both platforms, adds the
# install help, and publishes the release). tauri-action's own latest.json
# upload is off (includeUpdaterJson: false): it is a read-modify-write on one
# release asset, which parallel jobs could race on (#145). Because the release
# stays a draft until publish succeeds, a failed build never leaves users a
# half release; re-run the failed jobs and publish picks up where it stopped.
# A draft has no tag yet, so a brand new run after a failure would plan the
# same version again; prefer re-running the failed jobs.
#
# Builds are signed for the updater with secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The app reads latest.json from
# releases/latest/download, so the newest GitHub Release must be a desktop one;
# see docs/desktop-install.md.

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest stable desktop release"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version (e.g. 0.3.0 or 0.3.0-rc.1); overrides the bump"
        type: string
        required: false
      highlights:
        description: "Optional intro for the release notes (shown above the list of changes and in the app's update notes)"
        type: string
        required: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    # Decides whether to release and which version. Cheap, so the expensive
    # macOS build only starts when there is something to ship.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # read CI results for the commit being released
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the last release
      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          stop() { echo "release=false" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          last_tag=$(git tag --list 'desktop-v*' | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          last="${last_tag#desktop-v}"; last="${last:-0.0.0}"

          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#desktop-v}"
          else
            # Releases come from main only: a manual run on another branch is
            # an error, the schedule always runs on the default branch.
            if [ "$REF" != "refs/heads/main" ]; then
              echo "Releases are only built from main (ref is $REF)" >&2
              exit 1
            fi
            if [ -n "${EXACT:-}" ]; then
              version="$EXACT"
            else
              IFS=. read -r major minor patch <<< "$last"
              case "${BUMP:-patch}" in
                major) version="$((major + 1)).0.0" ;;
                minor) version="$major.$((minor + 1)).0" ;;
                patch) version="$major.$minor.$((patch + 1))" ;;
              esac
            fi
          fi

          if ! [[ "$version" =~ $semver ]]; then
            echo "'$version' is not a valid version" >&2
            exit 1
          fi
          tag="desktop-v$version"

          if [ "$EVENT" != "push" ]; then
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag already exists" >&2
              exit 1
            fi
            # A scheduled run is a no-op unless the app changed since the last release.
            if [ "$EVENT" = "schedule" ]; then
              if [ -n "$last_tag" ] && git diff --quiet "$last_tag" "$SHA" -- apps/desktop src Cargo.toml Cargo.lock; then
                stop "No app changes since $last_tag; nothing to release."
              fi
            fi
            # Only ship a commit whose required checks all passed. A release
            # started right after a merge can beat CI on main, so wait for
            # checks that are still queued or running (up to 15 minutes).
            deadline=$((SECONDS + 900))
            while :; do
              runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs')
              pending=""; failed=""
              for check in lint test test-linux desktop desktop-windows; do
                state=$(echo "$runs" | jq -r --arg n "$check" '[.[] | select(.name == $n)] | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
                case "$state" in
                  success) ;;
                  pending|missing) pending="$pending $check" ;;
                  *) failed="$failed $check ($state)" ;;
                esac
              done
              if [ -n "$failed" ]; then
                msg="Required checks failed on $SHA:$failed"
                if [ "$EVENT" = "schedule" ]; then stop "$msg; will retry tomorrow."; fi
                echo "$msg" >&2
                exit 1
              fi
              [ -z "$pending" ] && break
              if [ "$SECONDS" -ge "$deadline" ]; then
                msg="Required checks not finished on $SHA:$pending"
                if [ "$EVENT" = "schedule" ]; then stop "$msg; will retry tomorrow."; fi
                echo "$msg" >&2
                exit 1
              fi
              echo "Waiting for checks:$pending"
              sleep 20
            done
          fi

          # A hyphen in the version (0.2.0-rc.1) marks a pre-release.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "release=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "previous=$last_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (previous stable: ${last_tag:-none})"

  release:
    # Creates the draft release the builds upload into, and writes the notes.
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    outputs:
      id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - name: Write the release notes
        # GitHub lists the merged PRs since the previous release, grouped by
        # label as set in .github/release.yml. The same text becomes the
        # release body and the updater's notes in latest.json.
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          SHA: ${{ github.sha }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          set -euo pipefail
          args=(-f "tag_name=$TAG" -f "target_commitish=$SHA")
          if [ -n "$PREVIOUS" ]; then args+=(-f "previous_tag_name=$PREVIOUS"); fi
          generated=$(gh api -X POST "repos/$REPO/releases/generate-notes" "${args[@]}" --jq .body)
          {
            if [ -n "${HIGHLIGHTS:-}" ]; then printf '%s\n\n' "$HIGHLIGHTS"; fi
            printf '%s\n' "$generated"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" --arg sha "$SHA" --arg name "Rollin desktop $TAG" \
            --rawfile body "$RUNNER_TEMP/notes.md" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: true, prerelease: $pre}' \
            > "$RUNNER_TEMP/release.json"
          id=$(gh api -X POST "repos/$REPO/releases" --input "$RUNNER_TEMP/release.json" --jq .id)
          echo "Draft release $id for $TAG"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the draft release
    steps:
      - uses: actions/checkout@v7
      - name: Set the app version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          grep '"version"' "$conf"
      - name: Check updater signing is set up
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop-install.md" >&2
            exit 1
          fi
          if grep -q REPLACE_WITH apps/desktop/src-tauri/tauri.conf.json; then
            echo "tauri.conf.json still has the placeholder updater public key" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      # tauri-action v0.6.2, uploading to the draft by id. With
      # bundle.createUpdaterArtifacts it also uploads the signed .app.tar.gz
      # and its .sig; latest.json is written by publish instead.
      - uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: false
          args: --target universal-apple-darwin -- --locked

  windows:
    # Unsigned x64 NSIS installer (bundle.targets only lists the macOS bundles,
    # hence --bundles nsis). Runs alongside macos.
    needs: [plan, release]
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload assets to the draft release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set the app version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          grep '"version"' "$conf"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      - uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: false
          args: --bundles nsis -- --locked

  publish:
    # Runs only when both builds succeeded. Writes latest.json for both
    # platforms, adds the install help, and publishes the draft (which creates
    # the tag), so users never see a release without its updater file.
    needs: [plan, release, macos, windows]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload latest.json, publish the release
    steps:
      - name: Check the release has both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$ID" --jq '[.assets[] | {id, name}]' > "$RUNNER_TEMP/assets.json"
          jq -r '.[].name' "$RUNNER_TEMP/assets.json"
          for pattern in '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '-setup\.exe$' '-setup\.exe\.sig$'; do
            jq -e --arg p "$pattern" 'any(.[]; .name | test($p))' "$RUNNER_TEMP/assets.json" > /dev/null \
              || { echo "Missing asset matching $pattern" >&2; exit 1; }
          done
      - name: Write latest.json and upload it
        # The app reads this file from releases/latest/download. Same keys
        # tauri-action wrote before (checked against v0.1.4): the plain
        # target-arch key plus the -app / -nsis bundle-specific one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          asset_id() { jq -r --arg p "$1" '[.[] | select(.name | test($p))][0].id' "$RUNNER_TEMP/assets.json"; }
          asset_name() { jq -r --arg p "$1" '[.[] | select(.name | test($p))][0].name' "$RUNNER_TEMP/assets.json"; }
          sig() { gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$(asset_id "$1")" | tr -d '\r\n'; }
          mac_sig=$(sig '\.app\.tar\.gz\.sig$')
          win_sig=$(sig '-setup\.exe\.sig$')
          mac_url="$base/$(asset_name '\.app\.tar\.gz$')"
          win_url="$base/$(asset_name '-setup\.exe$')"
          jq -n --arg version "$VERSION" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$mac_sig" --arg mac_url "$mac_url" --arg win_sig "$win_sig" --arg win_url "$win_url" '
            {signature: $mac_sig, url: $mac_url} as $mac
            | {signature: $win_sig, url: $win_url} as $win
            | {version: $version, notes: $notes, pub_date: $date, platforms: {
                "darwin-aarch64": $mac, "darwin-x86_64": $mac,
                "darwin-aarch64-app": $mac, "darwin-x86_64-app": $mac,
                "windows-x86_64": $win, "windows-x86_64-nsis": $win}}' > "$RUNNER_TEMP/latest.json"
          jq . "$RUNNER_TEMP/latest.json"
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p] | (.url // "") != "" and (.signature // "") != ""' "$RUNNER_TEMP/latest.json" > /dev/null \
              || { echo "latest.json has no usable $platform entry" >&2; exit 1; }
          done
          # Replace any latest.json from an earlier attempt, then upload.
          for old in $(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/assets.json"); do
            gh api -X DELETE "repos/$REPO/releases/assets/$old"
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/latest.json" \
            "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=latest.json" > /dev/null
      - name: Add install help and publish the release
        # Last, so latest.json (the app's update notes) keeps only the changes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.release.outputs.id }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n---\n\n' "$NOTES"
            echo 'Unsigned builds.'
            echo
            echo '**macOS** (universal: Apple Silicon and Intel): download the `.dmg`. On first'
            echo 'launch macOS will refuse to open the app: right-click Rollin.app and'
            echo 'choose Open, or run `xattr -dr com.apple.quarantine /Applications/Rollin.app`.'
            echo
            echo '**Windows** (64-bit): download the `-setup.exe` and run it. If SmartScreen'
            echo 'says "Windows protected your PC", click More info, then Run anyway.'
            echo
            echo 'See docs/desktop-install.md.'
          } > "$RUNNER_TEMP/page.md"
          if [ "$PRERELEASE" = "true" ]; then latest=false; else latest=true; fi
          jq -n --rawfile body "$RUNNER_TEMP/page.md" --arg latest "$latest" \
            '{body: $body, draft: false, make_latest: $latest}' > "$RUNNER_TEMP/publish.json"
          gh api -X PATCH "repos/$REPO/releases/$ID" --input "$RUNNER_TEMP/publish.json" --jq .html_url
