name: audit

# bun audit, from sm-core. Not a required check: a new advisory can turn it
# red on an unrelated PR.

on:
  pull_request:
    paths: ["**/package.json", "bun.lock"]
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    uses: scottwmacleod/sm-core/.github/workflows/audit.yml@v26.11.12
    with:
      package-manager: bun
