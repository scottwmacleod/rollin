name: Audit

# Dependency advisories via `npm audit`. Deliberately not a required check: a
# new advisory can turn this red on an unrelated PR or on the weekly run.

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - ".github/workflows/audit.yml"
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:43 UTC, to catch advisories published since the last change.
    - cron: "43 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
