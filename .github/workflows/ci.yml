name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  web:
    uses: scottwmacleod/sm-core/.github/workflows/web-ci.yml@v26.11.33
    with:
      package-manager: bun
      checks: bun run tokens:check
      typecheck-command: bun run typecheck
      e2e: true
      e2e-shards: 3
      skip-paths: '^(docs/|\.claude/|\.github/workflows/(auto-merge|audit|behind|dependabot-automerge|tsc)\.yml$|skills-lock\.json$|LICENSE$|[^/]+\.md$)'

  budgets:
    uses: scottwmacleod/sm-core/.github/workflows/budgets.yml@v26.11.33
    permissions:
      contents: read
      pull-requests: write
    with:
      package-manager: bun
      dist-dir: apps/web/dist
      js-kb: 190
      css-kb: 55

  ci:
    needs: [web, budgets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.web.result }}" = success && test "${{ needs.budgets.result }}" = success
