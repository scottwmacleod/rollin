name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per ref so superseded runs cancel; pushes to main get a
  # unique group per commit so no main run is ever cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked

  desktop:
    # Builds the Tauri app (ADR-0007). Workspace default-members keep it out of
    # the jobs above, so this is the only job that compiles it.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check -p rollin-desktop
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      - name: Build front end
        run: npm --prefix apps/desktop run build
      - name: Test front end
        run: npm --prefix apps/desktop test
      - name: Clippy
        run: cargo clippy -p rollin-desktop --all-targets --locked -- -D warnings
      - name: Build app
        run: cargo build -p rollin-desktop --locked

  msrv:
    # Builds and tests with exactly the compiler declared as `rust-version` in
    # Cargo.toml. rust-toolchain.toml (channel = "stable") would otherwise win
    # over the installed toolchain, so RUSTUP_TOOLCHAIN forces it. Keep the
    # version strings here in sync with Cargo.toml. Not a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch, 2026-11-06
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show compiler
        run: rustc --version
      - name: Test
        run: cargo test --locked

  ci:
    # The one required check (baseline). Fails if any gate failed or was
    # skipped. msrv stays out on purpose: it is not a required check.
    if: always()
    needs: [lint, test, test-linux, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
