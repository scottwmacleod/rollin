name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per ref so superseded runs cancel; pushes to main get a
  # unique group per commit so no main run is ever cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Lets web-only and docs-only PRs skip the slow Rust and desktop gates.
    # Those gates are required checks, and a job skipped by `if` reports as
    # skipped, which branch protection accepts. Fails open: pushes to main,
    # manual runs and any doubt about the diff run everything, so the release
    # gate (release.yml) still sees every check pass on main.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Skip when only web or docs files changed
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/skip-if-only.sh '^(packages/|apps/web/|docs/|\.claude/|\.github/workflows/web\.yml$|package(-lock)?\.json$|biome\.json$|vercel\.json$|skills-lock\.json$|LICENSE$|[^/]+\.md$)'

  lint:
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked

  test-linux:
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked

  desktop:
    # Builds the Tauri app (ADR-0007). Workspace default-members keep it out of
    # the jobs above, so this is the only job that compiles it.
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check -p rollin-desktop
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      - name: Build front end
        run: npm --prefix apps/desktop run build
      - name: Test front end
        run: npm --prefix apps/desktop test
      - name: Clippy
        run: cargo clippy -p rollin-desktop --all-targets --locked -- -D warnings
      - name: Build app
        run: cargo build -p rollin-desktop --locked

  desktop-windows:
    # Same as `desktop` but on Windows (#144). Stays on `-p rollin-desktop`
    # because the root crate's rexpect dev-dependency is unix-only. Required
    # since #164, so `ci` needs it.
    needs: changes
    # !cancelled() so a failed `changes` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-06
        with:
          components: clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install front-end dependencies
        run: npm --prefix apps/desktop ci
      - name: Build front end
        run: npm --prefix apps/desktop run build
      - name: Test front end
        run: npm --prefix apps/desktop test
      - name: Clippy
        run: cargo clippy -p rollin-desktop --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p rollin-desktop --locked
      - name: Build app
        run: cargo build -p rollin-desktop --locked

  ci:
    # Fails if any gate failed or was cancelled. A gate skipped because only
    # web or docs files changed is fine, but `changes` itself must succeed.
    if: always()
    needs: [changes, lint, test, test-linux, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
          [ "$CHANGES" = success ] || exit 1
