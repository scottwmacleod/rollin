name: Bug report
description: Something doesn't work the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. Check the open issues first in case someone has already raised it. The more exact the steps, the faster it gets fixed.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page
        2. Press ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste any error text or add a screenshot.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPhone 16, Chrome 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
